[PHP]
; Increase max_input_vars for complex Filament forms with nested Repeaters
max_input_vars = 10000

; Memory and upload limits
memory_limit = 256M
post_max_size = 100M
upload_max_filesize = 100M

; Execution time for complex operations
max_execution_time = 120
max_input_time = 120

; Session settings
session.gc_maxlifetime = 7200
